
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c14">
<meta name="description" content="ERO SOUND PAD USB MIDI Sound Module">
<title>ERO SOUND PAD</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./assets/icons/icon.svg">
<link rel="stylesheet" href="./style.css">

<style>
* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  min-height:100%;
  background:#080c14;
  color:#f5f7ff;
  font-family:Arial, sans-serif;
}

body {
  overflow-x:hidden;
}

.sound-app {
  width:100%;
  min-height:100vh;
  padding:10px 16px;
  display:flex;
  flex-direction:column;
  gap:9px;
  background:
    radial-gradient(ellipse at center,#17243b 0%,#080c14 75%);
}

.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:48px;
  border-bottom:1px solid #29364d;
  padding-bottom:8px;
}

.brand-area {
  display:flex;
  align-items:center;
  gap:10px;
}

.logo {
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,#39d7e8,#6575ff);
  color:#06101c;
  font-weight:900;
  font-size:21px;
}

.brand-name {
  font-weight:900;
  font-size:14px;
  letter-spacing:2px;
}

.brand-name small {
  display:block;
  font-size:8px;
  color:#8291aa;
  letter-spacing:2px;
  margin-top:3px;
}

.status-area {
  display:flex;
  align-items:center;
  gap:7px;
  color:#9aabc4;
  font-size:10px;
}

#dot {
  width:8px;
  height:8px;
  background:#788397;
  border-radius:50%;
}

#dot.on {
  background:#46e0a0;
  box-shadow:0 0 10px #46e0a0;
}

.menu-button {
  width:37px;
  height:35px;
  border:1px solid #34445e;
  border-radius:9px;
  background:#172338;
  color:white;
  font-size:21px;
  cursor:pointer;
}

.performance-area {
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 180px;
  gap:12px;
}

.pad-area {
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.pad-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#39d7e8;
  font-size:10px;
  letter-spacing:2px;
  font-weight:bold;
}

.pad-heading span {
  color:#8997b0;
  font-size:9px;
  letter-spacing:1px;
}

.pad-grid {
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(100px,1fr));
  gap:10px;
}

.pad {
  --accent:#39d7e8;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-width:0;
  min-height:100px;
  border:1px solid #34445e;
  border-radius:15px;
  background:linear-gradient(145deg,#1b2a40,#101827);
  color:#fff;
  touch-action:manipulation;
  overflow:hidden;
  cursor:pointer;
  transition:transform .08s,border-color .1s;
}

.pad::before {
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  border-radius:50%;
  background:var(--accent);
  opacity:.09;
  filter:blur(15px);
  top:-55px;
  right:-40px;
}

.pad:active,.pad.active {
  transform:scale(.97);
  border-color:var(--accent);
  box-shadow:inset 0 0 25px #ffffff12,0 0 18px #39d7e833;
}

.pad-number {
  position:absolute;
  top:9px;
  left:11px;
  font-size:9px;
  color:#8997b0;
}

.pad-icon {
  font-size:clamp(23px,4vw,34px);
  color:var(--accent);
}

.pad strong {
  font-size:clamp(9px,1.5vw,12px);
  letter-spacing:1px;
}

.pad small {
  font-size:8px;
  color:#8997b0;
  letter-spacing:1px;
}

.kick {--accent:#39d7e8;}
.snare {--accent:#a78bfa;}
.hat {--accent:#47dfa6;}
.tom {--accent:#ffb45d;}
.cymbal {--accent:#ff7d9a;}

.kit-panel {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:center;
  gap:10px;
  border-left:1px solid #29364d;
  padding-left:12px;
}

.kit-title {
  color:#8997b0;
  font-size:9px;
  text-align:center;
  letter-spacing:2px;
}

.kit-display {
  text-align:center;
  font-size:14px;
  font-weight:900;
  color:#39d7e8;
  letter-spacing:1px;
  min-height:20px;
}

.kit-controls {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.kit-arrow {
  width:35px;
  height:32px;
  border-radius:8px;
  border:1px solid #34445e;
  background:#172338;
  color:#39d7e8;
  font-size:18px;
  cursor:pointer;
}

.kit-arrow:active {
  background:#25435a;
}

.kit-counter {
  text-align:center;
  font-size:9px;
  color:#8997b0;
}

.kit-description {
  color:#8997b0;
  font-size:9px;
  text-align:center;
  line-height:1.5;
}

.bottom-bar {
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-top:1px solid #29364d;
  padding-top:7px;
  font-size:9px;
  color:#8997b0;
}

.bottom-bar button {
  background:#172338;
  border:1px solid #34445e;
  color:#dce8ff;
  border-radius:7px;
  padding:7px 12px;
  font-size:9px;
}

#toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,15px);
  opacity:0;
  background:#e8fcff;
  color:#07111d;
  padding:10px 15px;
  border-radius:9px;
  font-size:12px;
  font-weight:bold;
  z-index:100;
  transition:.2s;
  pointer-events:none;
}

#toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

@media (orientation:portrait) {
  .sound-app {
    min-height:100vh;
  }

  .performance-area {
    grid-template-columns:1fr;
    grid-template-rows:1fr auto;
  }

  .kit-panel {
    border-left:0;
    border-top:1px solid #29364d;
    padding:10px 0 0;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
  }

  .kit-description {
    display:none;
  }

  .pad-grid {
    grid-template-rows:repeat(2,minmax(110px,1fr));
  }
}

@media (orientation:landscape) and (max-height:500px) {
  .sound-app {
    padding:6px 12px;
    gap:5px;
    height:100dvh;
    min-height:0;
  }

  .topbar {
    min-height:36px;
    padding-bottom:4px;
  }

  .logo {
    width:29px;
    height:29px;
    font-size:17px;
  }

  .performance-area {
    grid-template-columns:minmax(0,1fr) 155px;
  }

  .pad-grid {
    grid-template-rows:repeat(2,minmax(70px,1fr));
    gap:7px;
  }

  .pad {
    min-height:70px;
    border-radius:11px;
  }

  .kit-panel {
    gap:6px;
  }

  .bottom-bar {
    min-height:28px;
    padding-top:3px;
  }
}
</style>
</head>

<body>

<div class="sound-app">

  <header class="topbar">
    <div class="brand-area">
      <div class="logo">E</div>
      <div class="brand-name">
        ERO
        <small>SOUND PAD</small>
      </div>
    </div>

    <div class="status-area">
      <i id="dot"></i>
      <span id="connection">MIDI DISCONNECTED</span>
    </div>

    <button class="menu-button" id="menuButton" aria-label="Menu">☰</button>
  </header>

  <main class="performance-area">

    <section class="pad-area">

      <div class="pad-heading">
        PERFORMANCE PADS
        <span>8 PAD MIDI SYSTEM</span>
      </div>

      <div class="pad-grid" id="padGrid">

        <button class="pad kick" data-pad="0">
          <span class="pad-number">01</span>
          <span class="pad-icon">◉</span>
          <strong>KICK</strong>
          <small>NOTE 36</small>
        </button>

        <button class="pad snare" data-pad="1">
          <span class="pad-number">02</span>
          <span class="pad-icon">✳</span>
          <strong>SNARE</strong>
          <small>NOTE 38</small>
        </button>

        <button class="pad hat" data-pad="2">
          <span class="pad-number">03</span>
          <span class="pad-icon">◌</span>
          <strong>CLOSED HAT</strong>
          <small>NOTE 42</small>
        </button>

        <button class="pad hat" data-pad="3">
          <span class="pad-number">04</span>
          <span class="pad-icon">◎</span>
          <strong>OPEN HAT</strong>
          <small>NOTE 46</small>
        </button>

        <button class="pad tom" data-pad="4">
          <span class="pad-number">05</span>
          <span class="pad-icon">◍</span>
          <strong>LOW TOM</strong>
          <small>NOTE 45</small>
        </button>

        <button class="pad tom" data-pad="5">
          <span class="pad-number">06</span>
          <span class="pad-icon">◍</span>
          <strong>MID TOM</strong>
          <small>NOTE 47</small>
        </button>

        <button class="pad cymbal" data-pad="6">
          <span class="pad-number">07</span>
          <span class="pad-icon">✧</span>
          <strong>CRASH</strong>
          <small>NOTE 49</small>
        </button>

        <button class="pad cymbal" data-pad="7">
          <span class="pad-number">08</span>
          <span class="pad-icon">✧</span>
          <strong>RIDE</strong>
          <small>NOTE 51</small>
        </button>

      </div>
    </section>

    <aside class="kit-panel">

      <div class="kit-title">SOUND KIT</div>

      <div class="kit-controls">
        <button class="kit-arrow" id="previousKit" aria-label="Previous kit">‹</button>
        <button class="kit-arrow" id="nextKit" aria-label="Next kit">›</button>
      </div>

      <div class="kit-display" id="kitName">STUDIO</div>

      <div class="kit-counter" id="kitCounter">01 / 04</div>

      <p class="kit-description">
        Select your percussion sound kit using the arrow buttons.
      </p>

    </aside>

  </main>

  <footer class="bottom-bar">
    <span>ERO SOUND PAD · MIDI SOUND MODULE</span>
    <span id="midiTag">MIDI NOT CONNECTED</span>
    <button id="midi">CONNECT MIDI</button>
  </footer>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="./js/app.js"></script>

<script>
/* Landscape preference: browser/device support may vary */
async function requestLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("landscape");
    }
  } catch (error) {
    console.log("Landscape lock not available:", error.message);
  }
}

document.addEventListener("click", function firstInteraction() {
  requestLandscape();
  document.removeEventListener("click", firstInteraction);
});

/* Kit navigation */
const kitNames = ["STUDIO", "ELECTRONIC", "WORLD", "SRI LANKAN"];
let selectedKit = 0;

function updateKitDisplay() {
  document.getElementById("kitName").textContent = kitNames[selectedKit];
  document.getElementById("kitCounter").textContent =
    String(selectedKit + 1).padStart(2,"0") + " / " + kitNames.length;

  const oldSelect = document.getElementById("kit");
  if (oldSelect) oldSelect.value = [
    "studio","electronic","world","sri-lanka"
  ][selectedKit];
}

document.getElementById("previousKit").addEventListener("click", () => {
  selectedKit = (selectedKit - 1 + kitNames.length) % kitNames.length;
  updateKitDisplay();
  const oldSelect = document.getElementById("kit");
  if (oldSelect) oldSelect.dispatchEvent(new Event("change"));
});

document.getElementById("nextKit").addEventListener("click", () => {
  selectedKit = (selectedKit + 1) % kitNames.length;
  updateKitDisplay();
  const oldSelect = document.getElementById("kit");
  if (oldSelect) oldSelect.dispatchEvent(new Event("change"));
});

updateKitDisplay();

/* Menu placeholder */
document.getElementById("menuButton").addEventListener("click", () => {
  const message = "Settings menu will be added in the next development stage.";
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(window.menuToastTimer);
  window.menuToastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
});
</script>

</body>
</html>
