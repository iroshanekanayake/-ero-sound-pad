
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>ERO SOUND PAD</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root {
    --pad-border: #8fc5ff;
    --pad-glow: 0.55;
    --pad-radius: 12px;
    --pad-top: #19385e;
    --pad-bottom: #081426;
    --panel-bg: #070b13;
}
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--panel-bg);
    color: white;
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

button {
    font-family: inherit;
    cursor: pointer;
}

#app {
    width: 100%;
    height: 100dvh;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 9px;
    gap: 8px;
    background: var(--panel-bg);
}

/* TOP BAR */
.topbar {
    height: 43px;
    min-height: 43px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5px;
}

.brand {
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #e8f4ff;
    text-shadow: 0 0 12px #168dff;
}

.brand small {
    display: block;
    margin-top: 2px;
    font-size: 8px;
    letter-spacing: 2px;
    color: #7da9d8;
}

.menu-button {
    width: 40px;
    height: 36px;
    border: 1px solid #456b96;
    border-radius: 8px;
    color: white;
    background: #14243b;
    font-size: 23px;
}

/* MAIN AREA */
.main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 112px;
    gap: 10px;
    padding: 9px;
    border: 1px solid #34577c;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.72);
    box-shadow:
        0 0 20px rgba(0, 110, 255, 0.13),
        inset 0 0 18px rgba(30, 100, 180, 0.08);
}

/* EIGHT PADS */
#padGrid {
    display: grid !important;
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
    grid-template-rows: repeat(2, minmax(0, 1fr)) !important;
    gap: 9px !important;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
}

#padGrid [data-pad] {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    padding: 4px;

    border: 3px solid var(--pad-border) !important;
    border-radius: var(--pad-radius) !important;

    background:
        radial-gradient(ellipse at 50% 35%,
        rgba(28, 117, 205, 0.52),
        transparent 72%),
        linear-gradient(145deg, var(--pad-top), var(--pad-bottom) 80%) !important;

    color: #ffffff !important;
    font-size: clamp(10px, 2.2vw, 17px) !important;
    font-weight: 900 !important;
    letter-spacing: 1px;

    text-shadow: 0 2px 5px #000;
    box-shadow:
        inset 0 0 15px rgba(65, 155, 255, 0.35),
        0 0 8px rgba(65, 155, 255, var(--pad-glow)),
        0 4px 8px rgba(0, 0, 0, 0.7) !important;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    transition: transform 0.06s, background 0.06s;
}

#padGrid [data-pad]::before {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(190, 225, 255, 0.35);
    border-radius: 7px;
    pointer-events: none;
}

/* PAD PRESSED EFFECT */
#padGrid [data-pad]:active,
#padGrid [data-pad].active {
    transform: scale(0.96);
    border-color: #ffffff !important;
    background: radial-gradient(circle, #75e4ff, #147bd8 60%, #08264b) !important;
    box-shadow:
        0 0 15px #42caff,
        0 0 30px rgba(40, 160, 255, 0.95),
        inset 0 0 20px rgba(255,255,255,0.5) !important;
}

/* RIGHT CONTROL PANEL */
.side-panel {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    gap: 10px;
    min-width: 0;
    padding: 5px;
}

.connection {
    text-align: center;
    font-size: 9px;
    line-height: 1.5;
    color: #9ccaff;
    overflow-wrap: anywhere;
}

.status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 4px;
    border-radius: 50%;
    background: #e7a43c;
}

.status-dot.on {
    background: #27e88c;
    box-shadow: 0 0 8px #27e88c;
}

.kit-box {
    border: 1px solid #547da7;
    border-radius: 10px;
    padding: 8px 5px;
    background: linear-gradient(145deg, #172d48, #080f1c);
    text-align: center;
}

.kit-label {
    font-size: 9px;
    color: #8fb9e7;
    letter-spacing: 1px;
    margin-bottom: 7px;
}

.kit-name {
    min-height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffe36b;
    font-weight: 900;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.kit-buttons {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.kit-buttons button {
    height: 27px;
    border: 1px solid #7196bd;
    border-radius: 6px;
    background: #243e5d;
    color: white;
    font-size: 10px;
    font-weight: bold;
}

.kit-buttons button:active {
    background: #1687df;
}

.midi-button {
    height: 34px;
    border: 1px solid #4d9dff;
    border-radius: 7px;
    background: linear-gradient(135deg, #1264b5, #17365c);
    color: white;
    font-size: 10px;
    font-weight: bold;
}

.midi-button:active {
    background: #258de8;
}

/* BOTTOM BAR */
.bottom {
    height: 28px;
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5px;
    color: #7799bd;
    font-size: 9px;
    letter-spacing: 1px;
}

/* MENU PANEL */
#menuPanel {
    position: fixed;
    z-index: 20;
    top: 0;
    right: 0;
    width: min(340px, 88vw);
    height: 100dvh;
    padding: 15px;
    overflow-y: auto;
    background: #0c1727;
    border-left: 1px solid #42658c;
    box-shadow: -10px 0 30px #000b;
    transform: translateX(105%);
    transition: transform 0.2s ease;
}

#menuPanel.open {
    transform: translateX(0);
}

.menu-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    font-weight: bold;
    color: #b9dcff;
}

#closeMenu {
    border: 1px solid #456b96;
    border-radius: 6px;
    padding: 6px 12px;
    color: white;
    background: #1b3553;
}

.menu-section {
    margin: 12px 0;
    padding: 12px;
    border: 1px solid #294b70;
    border-radius: 10px;
    background: #101f33;
}

.menu-section h3 {
    margin: 0 0 10px;
    font-size: 12px;
    color: #80baff;
}

#volume {
    width: 100%;
    accent-color: #269cff;
}

#volumeText {
    font-size: 12px;
    color: #ffe36b;
}

#stop {
    width: 100%;
    height: 34px;
    border: 1px solid #bd5555;
    border-radius: 7px;
    background: #572329;
    color: white;
    font-weight: bold;
}

#mapping {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.mapping-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 5px;
    align-items: center;
    padding: 8px;
    border-radius: 7px;
    background: #172b43;
    font-size: 10px;
}

.mapping-row span {
    color: #8fc5ff;
}

.mapping-row button {
    grid-column: 1 / -1;
    height: 28px;
    border: 1px solid #4a8cc8;
    border-radius: 6px;
    background: #1d4770;
    color: white;
    font-size: 10px;
}

.mapping-row button.wait {
    background: #805d16;
}

/* TOAST */
#toast {
    position: fixed;
    z-index: 40;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 90vw;
    padding: 10px 16px;
    border: 1px solid #5598d6;
    border-radius: 8px;
    background: #10233a;
    color: white;
    font-size: 12px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
}

#toast.show {
    opacity: 1;
}

/* HIDDEN LEGACY SELECT */
#kit {
    display: none !important;
}

/* DESIGN SETTINGS CONTROLS */
.design-label {
    display: block;
    margin: 10px 0 5px;
    color: #a9c9eb;
    font-size: 11px;
}
#designSettings input[type="color"] {
    display: block;
    width: 100%;
    height: 34px;
    border: 1px solid #456b96;
    border-radius: 6px;
    background: #101f33;
}
#designSettings select {
    width: 100%;
    min-height: 34px;
    padding: 5px 8px;
    border: 1px solid #456b96;
    border-radius: 6px;
    background: #172b43;
    color: white;
}
.design-value {
    color: #ffe36b;
    font-size: 11px;
}
#resetDesign {
    width: 100%;
    min-height: 36px;
    margin-top: 14px;
    border: 1px solid #7ca8d3;
    border-radius: 7px;
    background: #203e5d;
    color: white;
    font-weight: bold;
}

/* LANDSCAPE */
@media (orientation: landscape) {
    #app {
        padding: 7px 12px;
        gap: 5px;
    }

    .topbar {
        height: 35px;
        min-height: 35px;
    }

    .main {
        padding: 8px;
        grid-template-columns: minmax(0, 1fr) 120px;
    }

    #padGrid {
        gap: 10px !important;
    }

    #padGrid [data-pad] {
        border-radius: var(--pad-radius) !important;
    }

    .bottom {
        height: 22px;
        min-height: 22px;
    }
}

/* SMALL LANDSCAPE PHONES */
@media (max-height: 400px) and (orientation: landscape) {
    .topbar {
        height: 29px;
        min-height: 29px;
    }

    .brand {
        font-size: 14px;
    }

    .main {
        padding: 5px;
        gap: 6px;
        grid-template-columns: minmax(0, 1fr) 105px;
    }

    #padGrid {
        gap: 6px !important;
    }

    #padGrid [data-pad] {
        border-width: 2px !important;
        border-radius: 9px !important;
    }

    .side-panel {
        gap: 5px;
    }

    .kit-box {
        padding: 5px 3px;
    }

    .bottom {
        height: 18px;
        min-height: 18px;
    }
}
</style>
</head>

<body>

<div id="app">

    <header class="topbar">
        <div class="brand">
            ERO SOUND PAD
            <small>PROFESSIONAL MIDI OCTAPAD</small>
        </div>

        <button class="menu-button" id="menuButton" aria-label="Open menu">☰</button>
    </header>

    <main class="main">

        <!-- 8 TOUCH PADS -->
        <section id="padGrid">

            <button class="pad" data-pad="0">KICK</button>
            <button class="pad" data-pad="1">SNARE</button>
            <button class="pad" data-pad="2">CLOSED HAT</button>
            <button class="pad" data-pad="3">OPEN HAT</button>

            <button class="pad" data-pad="4">LOW TOM</button>
            <button class="pad" data-pad="5">MID TOM</button>
            <button class="pad" data-pad="6">CRASH</button>
            <button class="pad" data-pad="7">RIDE</button>

        </section>

        <!-- RIGHT SIDE -->
        <aside class="side-panel">

            <div class="connection">
                <span class="status-dot" id="dot"></span>
                <span id="connection">MIDI NOT CONNECTED</span>
            </div>

            <div class="kit-box">
                <div class="kit-label">SOUND KIT</div>

                <div class="kit-name" id="kitName">STUDIO</div>

                <div class="kit-buttons">
                    <button id="previousKit">▲ PREVIOUS</button>
                    <button id="nextKit">NEXT ▼</button>
                </div>
            </div>

            <button class="midi-button" id="midi">
                USB MIDI CONNECT
            </button>

            <div class="connection" id="midiTag">
                NO DEVICE
            </div>

        </aside>

    </main>

    <footer class="bottom">
        <span>ERO SOUND PAD</span>
        <span id="audio">AUDIO READY</span>
        <span id="rate">—</span>
    </footer>

</div>

<!-- SETTINGS / MENU -->
<div id="menuPanel">

    <div class="menu-heading">
        <span>ERO SOUND PAD SETTINGS</span>
        <button id="closeMenu">CLOSE ✕</button>
    </div>

    <section class="menu-section">
        <h3>MASTER VOLUME</h3>
        <input type="range" id="volume" min="0" max="100" value="80">
        <div id="volumeText">80%</div>
    </section>

    <section class="menu-section">
        <h3>ALL SOUNDS</h3>
        <button id="stop">STOP ALL SOUNDS</button>
    </section>

    <section class="menu-section" id="designSettings">
        <h3>PLAY SCREEN DESIGN</h3>

        <label class="design-label" for="designPadColor">Pad colour</label>
        <input type="color" id="designPadColor" value="#19385e">

        <label class="design-label" for="designBorderColor">Pad border colour</label>
        <input type="color" id="designBorderColor" value="#8fc5ff">

        <label class="design-label" for="designGlow">Glow strength</label>
        <input type="range" id="designGlow" min="0" max="100" value="55">
        <div class="design-value" id="designGlowValue">55%</div>

        <label class="design-label" for="designRadius">Pad shape</label>
        <select id="designRadius">
            <option value="4px">Square</option>
            <option value="10px">Soft rounded</option>
            <option value="16px">Rounded</option>
        </select>

        <label class="design-label" for="designBackground">Background</label>
        <select id="designBackground">
            <option value="dark">Dark studio</option>
            <option value="blue">Deep blue</option>
            <option value="black">Pure black</option>
            <option value="forest">Forest green</option>
        </select>

        <button type="button" id="resetDesign">RESET DESIGN</button>
    </section>

    <section class="menu-section">
        <h3>MIDI PAD MAPPING / MIDI LEARN</h3>
        <div id="mapping"></div>
    </section>

</div>

<!-- EXISTING APP.JS COMPATIBILITY -->
<select id="kit">
    <option value="studio">STUDIO</option>
    <option value="electronic">ELECTRONIC</option>
    <option value="world">WORLD</option>
    <option value="sri-lankan">SRI LANKAN</option>
</select>

<div id="toast"></div>

<script src="./app.js"></script>

<script>
/* MENU */
const menuPanel = document.getElementById("menuPanel");

document.getElementById("menuButton").addEventListener("click", () => {
    menuPanel.classList.add("open");
});

document.getElementById("closeMenu").addEventListener("click", () => {
    menuPanel.classList.remove("open");
});

/* KIT NAVIGATION */
const kits = [
    { value: "studio", name: "STUDIO" },
    { value: "electronic", name: "ELECTRONIC" },
    { value: "world", name: "WORLD" },
    { value: "sri-lankan", name: "SRI LANKAN" }
];

let currentKit = 0;

const kitSelect = document.getElementById("kit");
const kitName = document.getElementById("kitName");

function changeKit(index) {
    currentKit = (index + kits.length) % kits.length;

    kitName.textContent = kits[currentKit].name;
    kitSelect.value = kits[currentKit].value;

    kitSelect.dispatchEvent(new Event("change", {
        bubbles: true
    }));
}

document.getElementById("previousKit").addEventListener("click", () => {
    changeKit(currentKit - 1);
});

document.getElementById("nextKit").addEventListener("click", () => {
    changeKit(currentKit + 1);
});

/* VOLUME LABEL */
document.getElementById("volume").addEventListener("input", function() {
    document.getElementById("volumeText").textContent = this.value + "%";
});

/* CUSTOM DESIGN SETTINGS - independent from audio and MIDI */
const designDefaults = {
    padColor: "#19385e",
    borderColor: "#8fc5ff",
    glow: 55,
    radius: "4px",
    background: "dark"
};

const designControls = {
    padColor: document.getElementById("designPadColor"),
    borderColor: document.getElementById("designBorderColor"),
    glow: document.getElementById("designGlow"),
    radius: document.getElementById("designRadius"),
    background: document.getElementById("designBackground")
};

function applyDesign(settings) {
    const root = document.documentElement;
    root.style.setProperty("--pad-top", settings.padColor);
    root.style.setProperty("--pad-border", settings.borderColor);
    root.style.setProperty("--pad-glow", String(Number(settings.glow) / 100));
    root.style.setProperty("--pad-radius", settings.radius);

    const backgrounds = {
        dark: "#070b13",
        blue: "#07182b",
        black: "#000000",
        forest: "#071b16"
    };
    root.style.setProperty("--panel-bg", backgrounds[settings.background] || backgrounds.dark);

    designControls.padColor.value = settings.padColor;
    designControls.borderColor.value = settings.borderColor;
    designControls.glow.value = settings.glow;
    designControls.radius.value = settings.radius;
    designControls.background.value = settings.background;
    document.getElementById("designGlowValue").textContent = settings.glow + "%";
}

function readDesignControls() {
    return {
        padColor: designControls.padColor.value,
        borderColor: designControls.borderColor.value,
        glow: Number(designControls.glow.value),
        radius: designControls.radius.value,
        background: designControls.background.value
    };
}

function saveAndApplyDesign() {
    const settings = readDesignControls();
    applyDesign(settings);
    try {
        localStorage.setItem("ERO_SOUND_PAD_DESIGN_V1", JSON.stringify(settings));
    } catch (error) {
        console.warn("Design settings could not be saved.", error);
    }
}

try {
    const savedDesign = localStorage.getItem("ERO_SOUND_PAD_DESIGN_V1");
    applyDesign(savedDesign ? { ...designDefaults, ...JSON.parse(savedDesign) } : designDefaults);
} catch (error) {
    applyDesign(designDefaults);
}

Object.values(designControls).forEach(control => {
    control.addEventListener("input", saveAndApplyDesign);
    control.addEventListener("change", saveAndApplyDesign);
});

document.getElementById("resetDesign").addEventListener("click", () => {
    applyDesign(designDefaults);
    try {
        localStorage.removeItem("ERO_SOUND_PAD_DESIGN_V1");
    } catch (error) {}
});

/* LANDSCAPE ORIENTATION REQUEST */
function requestLandscape() {
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
    }
}

document.addEventListener("pointerdown", requestLandscape, {
    once: true
});
</script>

</body>
</html>
